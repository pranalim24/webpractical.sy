<!DOCTYPE html>
<html>
    <head>
        <title>Calculator</title>
        <style>
            body {
                margin: 10px;
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                background: linear-gradient(135deg, #2f4ca8  0%, #0c021d 100%);
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                color: #000103;
            }

            .calculator {
                background: #2f98d4;
                padding: 30px;
                border-radius: 24px;
                box-shadow: 0 20px 50px rgba(27, 165, 147, 0.12);
                width: 340px;
                text-align: center;
            }

            h2 {
                margin: 0 0 20px;
                font-size: 1.8rem;
                letter-spacing: 0.02em;
            }

            input {
                width: 100%;
                padding: 14px 16px;
                margin: 0 0 12px 0;
                border: 1px solid #14818f;
                border-radius: 14px;
                font-size: 1rem;
                outline: none;
                transition: border-color 0.2s ease, box-shadow 0.2s ease;
            }

            input:focus {
                border-color: #1898b8;
                box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
            }

            .button-row {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                justify-content: center;
                margin-top: 16px;
            }

            button {
                flex: 1 1 45%;
                padding: 14px 0;
                border: none;
                border-radius: 14px;
                background: #15367e;
                color: #45a5c2;
                font-size: 1rem;
                font-weight: 600;
                cursor: pointer;
                transition: background 0.2s ease, transform 0.1s ease;
            }

            button:hover {
                background: #1d9dd8;
            }

            button:active {
                transform: translateY(1px);
            }

            #result {
                margin-top: 22px;
                min-height: 1.5em;
                font-size: 1.4rem;
                color: #111827;
            }
        </style>
    </head>
<body>
    <div class="calculator">
        <h2>Simple Calculator</h2>
        <input type="number" id="firstNumber" placeholder="Enter first number">
        <input type="number" id="secondNumber" placeholder="Enter second number">
        <div class="button-row">
            <button onclick="Add()">Add</button>
            <button onclick="Subtraction()">Subtract</button>
            <button onclick="multiplication()">Multiply</button>
            <button onclick="division()">Divide</button>
        </div>
        <h3 id="result"></h3>
    </div>

    <script>
        function Add() {
            let a = Number(document.getElementById('firstNumber').value);
            let b = Number(document.getElementById('secondNumber').value);
            document.getElementById('result').textContent = a + b;
        }

        function Subtraction() {
            let a = Number(document.getElementById('firstNumber').value);
            let b = Number(document.getElementById('secondNumber').value);
            document.getElementById('result').textContent = a - b;
        }

        function multiplication() {
            let a = Number(document.getElementById('firstNumber').value);
            let b = Number(document.getElementById('secondNumber').value);
            document.getElementById('result').textContent = a * b;
        }

        function division() {
            let a = Number(document.getElementById('firstNumber').value);
            let b = Number(document.getElementById('secondNumber').value);
            document.getElementById('result').textContent = b !== 0 ? a / b : 'Cannot divide by 0';
        }
    </script>
</body>
</html>
